<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Երկու փոքրիկ աստղեր</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0d;
    --panel: #111114;
    --gold: #cba158;
    --gold-soft: rgba(203,161,88,0.35);
    --gold-dim: rgba(203,161,88,0.14);
    --text-warm: #f3ede1;
    --text-dim: #948d7d;
    --child-a: #cba158;
    --child-b: #b98a9c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); height:100%; overflow:hidden; }
  body{
    font-family: 'Inter', sans-serif;
    color: var(--text-warm);
    position: relative;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
  }

  .panel{
    position: relative;
    flex: 1;
    height: 100%;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .frame{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 2.4s ease, transform 8s ease;
    filter: saturate(0.85) brightness(0.72);
  }
  .frame.active{
    opacity: 1;
    transform: scale(1);
  }

  .panel::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(6,6,8,0.92) 0%, rgba(6,6,8,0.35) 45%, rgba(6,6,8,0.55) 100%);
    pointer-events: none;
  }

  .panel-left .frame{ background-color:#3a2f21; }
  .panel-right .frame{ background-color:#2e2530; }

  .caption{
    position: relative;
    z-index: 2;
    text-align: center;
    padding-bottom: 9vh;
    width: 100%;
  }
  .child-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 34px;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .panel-left .child-name{ color: var(--child-a); }
  .panel-right .child-name{ color: var(--child-b); }

  .photo-label{
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 300;
    letter-spacing: 0.08em;
    min-height: 16px;
  }

  /* center divider */
  .divider{
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom,
      rgba(203,161,88,0) 0%,
      var(--gold-soft) 40%,
      var(--gold-soft) 60%,
      rgba(203,161,88,0) 100%);
    z-index: 5;
    box-shadow: 0 0 24px 2px var(--gold-dim);
  }

  .monogram{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 6;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20,18,14,0.95) 0%, rgba(10,10,12,0.98) 70%);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 0 30px 6px var(--gold-dim), inset 0 0 12px rgba(203,161,88,0.15);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--gold);
  }

  header.site-title{
    position: absolute;
    top: 6vh; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    text-align: center;
    pointer-events: none;
  }
  header.site-title .eyebrow{
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--text-dim);
    font-weight: 300;
  }
  header.site-title h1{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    color: var(--text-warm);
    margin-top: 4px;
    text-shadow: 0 0 18px var(--gold-dim);
  }

  .progress-dots{
    position: absolute;
    bottom: 4vh;
    z-index: 6;
    display:flex; gap:6px;
  }
  .panel-left .progress-dots{ left: 50%; transform: translateX(-100%) translateX(-40px); }
  .panel-right .progress-dots{ right: 50%; transform: translateX(100%) translateX(40px); }
  .dot{
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }
  .dot.on{
    background: var(--gold);
    box-shadow: 0 0 6px 1px var(--gold-dim);
  }

  @media (max-width: 720px){
    .child-name{ font-size: 26px; }
    header.site-title h1{ font-size: 18px; }
    .monogram{ width: 52px; height: 52px; font-size: 16px; }
  }
</style>
</head>
<body>

<header class="site-title">
  <div class="eyebrow">ընտանեկան արխիվ</div>
  <h1>փոքրիկ պահեր, մեծ սեր</h1>
</header>

<div class="stage">
  <div class="panel panel-left" id="panelA">
    <div class="frame" id="frameA0" style="background-image:linear-gradient(160deg,#4a3823,#221a10);"></div>
    <div class="frame" id="frameA1" style="background-image:linear-gradient(200deg,#5a4426,#241c10);"></div>
    <div class="frame" id="frameA2" style="background-image:linear-gradient(120deg,#3f3018,#1c150c);"></div>
    <div class="caption">
      <div class="child-name">Անի</div>
      <div class="photo-label" id="labelA">Ամառ, 2024</div>
      <div class="progress-dots" id="dotsA"></div>
    </div>
  </div>

  <div class="panel panel-right" id="panelB">
    <div class="frame" id="frameB0" style="background-image:linear-gradient(160deg,#3d2f3d,#1a1420);"></div>
    <div class="frame" id="frameB1" style="background-image:linear-gradient(200deg,#4a3648,#1e1622);"></div>
    <div class="frame" id="frameB2" style="background-image:linear-gradient(120deg,#332638,#16121a);"></div>
    <div class="caption">
      <div class="child-name">Գոռ</div>
      <div class="photo-label" id="labelB">Ձմեռ, 2024</div>
      <div class="progress-dots" id="dotsB"></div>
    </div>
  </div>
</div>

<div class="divider"></div>
<div class="monogram">Ա&amp;Գ</div>

<script>
  const labelsA = ["Ամառ, 2024", "Ծննդյան օր", "Ծովափ"];
  const labelsB = ["Ձմեռ, 2024", "Առաջին քայլեր", "Այգում"];

  function setupDots(containerId, count){
    const el = document.getElementById(containerId);
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i===0 ? ' on' : '');
      d.id = containerId + '-' + i;
      el.appendChild(d);
    }
  }
  setupDots('dotsA', 3);
  setupDots('dotsB', 3);

  function cycle(prefix, labels, dotsId, interval, offset){
    let idx = 0;
    const frames = [0,1,2].map(i => document.getElementById(prefix + i));
    const label = document.getElementById('label' + prefix.slice(-1));
    frames[0].classList.add('active');

    setTimeout(() => {
      setInterval(() => {
        frames[idx].classList.remove('active');
        document.getElementById(dotsId + '-' + idx).classList.remove('on');
        idx = (idx + 1) % frames.length;
        frames[idx].classList.add('active');
        document.getElementById(dotsId + '-' + idx).classList.add('on');
        label.textContent = labels[idx];
      }, interval);
    }, offset);
  }

  cycle('frameA', labelsA, 'dotsA', 5000, 0);
  cycle('frameB', labelsB, 'dotsB', 5000, 1600);
</script>

</body>
</html>
